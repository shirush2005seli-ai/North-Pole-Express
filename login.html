
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Log In | North Pole Express</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #493329;
      background:
        radial-gradient(
          circle at 50% 5%,
          #ffffff 0%,
          #f7ebdf 55%,
          #ead7c4 100%
        );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 20px 40px;
    }

    .back-home {
      position: absolute;
      top: 24px;
      left: 25px;
      color: #7b263b;
      text-decoration: none;
      font-size: 14px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 43px 36px;
      background: rgba(255, 253, 248, 0.97);
      border: 1px solid #d9baa0;
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(76, 42, 27, 0.12);
      text-align: center;
    }

    .ornament {
      font-size: 38px;
      margin-bottom: 12px;
    }

    h1 {
      color: #7b263b;
      font-size: 30px;
      margin: 0 0 10px;
      font-weight: normal;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.6;
      color: #806c5c;
      margin-bottom: 30px;
    }

    form {
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #dbc7b4;
      border-radius: 10px;
      background: #fffefa;
      color: #493329;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    input:focus {
      outline: 2px solid #b58a63;
      outline-offset: 1px;
    }

    .main-button {
      width: 100%;
      padding: 15px;
      color: white;
      background: #7b263b;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .main-button:hover {
      background: #5c192a;
    }

    .main-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .forgot {
      display: block;
      text-align: right;
      margin: -7px 0 22px;
      color: #7b263b;
      font-size: 13px;
    }

    .footer-links {
      margin-top: 25px;
      font-size: 14px;
      line-height: 1.8;
    }

    a {
      color: #7b263b;
    }

    .message {
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .message.error {
      display: block;
      background: #fce8e8;
      color: #9b2634;
    }

    .message.success {
      display: block;
      background: #e9f3e9;
      color: #315a39;
    }

    .hidden {
      display: none;
    }

    .divider {
      margin: 25px 0;
      color: #b69a7d;
      font-size: 18px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <a href="index.html" class="back-home">
    ← Back to the North Pole
  </a>

  <main class="login-card">

    <div class="ornament" aria-hidden="true">❄️</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Your little corner of the North Pole
      is waiting for you.
      <br>
      Sign in to continue the Christmas magic.
    </p>

    <div id="message" class="message" role="status"
         aria-live="polite"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <a href="#" class="forgot" id="forgotLink">
        Forgot your password?
      </a>

      <button class="main-button"
              type="submit" id="loginButton">
        Log In
      </button>

    </form>

    <!-- PASSWORD RESET REQUEST -->
    <form id="resetForm" class="hidden">

      <label for="resetEmail">
        Your Email Address
      </label>

      <input
        type="email"
        id="resetEmail"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <button type="submit"
              class="main-button" id="resetButton">
        Send Reset Link
      </button>

      <div class="footer-links">
        <a href="#" id="backToLogin">
          Back to Log In
        </a>
      </div>

    </form>

    <!-- ENTER NEW PASSWORD -->
    <form id="newPasswordForm" class="hidden">

      <label for="newPassword">
        Create New Password
      </label>

      <input
        type="password"
        id="newPassword"
        minlength="8"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        required
      >

      <button type="submit"
              class="main-button" id="savePasswordButton">
        Save New Password
      </button>

    </form>

    <div class="footer-links" id="signupFooter">
      New to the North Pole?
      <br>
      <a href="signup.html">
        Create Your Christmas Account
      </a>
    </div>

    <div class="divider" aria-hidden="true">✧ ❄ ✧</div>

    <small>
      Made with Christmas magic
      <br>
      North Pole Express
    </small>

  </main>

  <!-- Supabase browser SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    // Public Supabase configuration.
    // Never put a secret or service-role key here.
    const SUPABASE_URL =
      "https://yeubpbvxihqhodwspuav.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_JcAJkEMletFG5TGXA8ny3Q_cIW2qrrp";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm =
      document.getElementById("loginForm");

    const resetForm =
      document.getElementById("resetForm");

    const newPasswordForm =
      document.getElementById("newPasswordForm");

    const message =
      document.getElementById("message");

    const signupFooter =
      document.getElementById("signupFooter");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function showForm(form) {
      loginForm.classList.add("hidden");
      resetForm.classList.add("hidden");
      newPasswordForm.classList.add("hidden");

      form.classList.remove("hidden");

      signupFooter.classList.toggle(
        "hidden",
        form !== loginForm
      );

      clearMessage();
    }

    function setLoading(button, loading, label) {
      button.disabled = loading;
      button.textContent = loading
        ? "Please wait..."
        : label;
    }

    // LOGIN
    loginForm.addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();
        clearMessage();

        const email =
          document.getElementById("email")
            .value.trim();

        const password =
          document.getElementById("password").value;

        const button =
          document.getElementById("loginButton");

        setLoading(button, true, "Log In");

        try {
          const { error } =
            await db.auth.signInWithPassword({
              email,
              password
            });

          if (error) throw error;

          showMessage(
            "Welcome back! Taking you to the North Pole...",
            "success"
          );

          // Temporary destination until we build
          // the private customer account dashboard.
          window.location.assign("index.html");


        } catch (error) {
          showMessage(
            "Unable to sign in. Please check " +
            "your credentials and email verification."
          );
        } finally {
          setLoading(button, false, "Log In");
        }
      }
    );

    // SHOW RESET FORM
    document.getElementById("forgotLink")
      .addEventListener("click", function(event) {
        event.preventDefault();
        showForm(resetForm);
      });

    document.getElementById("backToLogin")
      .addEventListener("click", function(event) {
        event.preventDefault();
        showForm(loginForm);
      });

    // SEND PASSWORD RESET EMAIL
    resetForm.addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();
        clearMessage();

        const email =
          document.getElementById("resetEmail")
            .value.trim();

        const button =
          document.getElementById("resetButton");

        setLoading(button, true, "Send Reset Link");

        try {
          const { error } =
            await db.auth.resetPasswordForEmail(
              email,
              {
                redirectTo:
                  window.location.origin + "/login.html"
              }
            );

          if (error) throw error;

          showMessage(
            "If an account exists for this email, " +
            "you'll receive a password reset link.",
            "success"
          );

        } catch (error) {
          showMessage(
            "We couldn't send the reset request. " +
            "Please try again later."
          );
        } finally {
          setLoading(button, false, "Send Reset Link");
        }
      }
    );

    // LISTEN FOR PASSWORD RECOVERY LINK
    db.auth.onAuthStateChange(
      (event) => {
        if (event === "PASSWORD_RECOVERY") {
          showForm(newPasswordForm);
        }
      }
    );

    // SAVE NEW PASSWORD
    newPasswordForm.addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();
        clearMessage();

        const password =
          document.getElementById("newPassword").value;

        const button =
          document.getElementById("savePasswordButton");

        setLoading(button, true, "Save New Password");

        try {
          const { error } =
            await db.auth.updateUser({
              password
            });

          if (error) throw error;

          await db.auth.signOut();

          showForm(loginForm);

          showMessage(
            "Your password has been updated. " +
            "Please log in again.",
            "success"
          );

        } catch (error) {
          showMessage(
            "Unable to update your password. " +
            "Please request a new reset link."
          );
        } finally {
          setLoading(
            button,
            false,
            "Save New Password"
          );
        }
      }
    );
  </script>

</body>
</html>
